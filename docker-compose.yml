services:
  db:
    image: postgres:15-alpine
    container_name: talexia-postgres
    environment:
      POSTGRES_USER: talexia_user
      POSTGRES_PASSWORD: talexia_password
      POSTGRES_DB: talexia_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talexia_user -d talexia_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: talexia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:  
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talexia-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://neondb_owner:npg_6i9kpnMxAazR@ep-withered-leaf-a1zpijmg-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      PORT: 4000
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
